<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <title>兰兰导管日记</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">

    <header class="hero">
      <div class="hero-row">
        <h1>兰兰导管日记</h1>
        <span class="today-chip" id="dateLine"></span>
      </div>
      <nav class="tabs" id="tabs">
        <button type="button" class="tab is-active" data-tab="today">今日</button>
        <button type="button" class="tab" data-tab="history">历史</button>
      </nav>
    </header>

    <section id="view-today" class="view">
      <div class="card counter-card">
        <div class="counter-label">今天已导管</div>
        <div class="counter-num" id="countNum">0</div>
        <div class="counter-sub" id="countSub">导完一次就点一下“记录一次”</div>
        <div class="counter-actions">
          <button type="button" class="btn primary add-count" id="addBtn">＋ 记录一次</button>
          <button type="button" class="btn ghost undo-count" id="undoBtn">撤销一次</button>
        </div>
      </div>

      <div class="card tip-card">
        <div class="tip-emoji">💧</div>
        <p>每次导管后点“记录一次”；点错了可以点“撤销一次”减回去。<br />记录只保存在这台设备的浏览器里，不会上传。</p>
      </div>
    </section>

    <section id="view-history" class="view is-hidden">
      <div class="card stats-card">
        <div class="stat">
          <span class="stat-num" id="statToday">0</span>
          <span class="stat-label">今日导管次数</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="statStreak">0</span>
          <span class="stat-label">连续导管天数</span>
        </div>
      </div>

      <div class="card cal-card">
        <div class="cal-head">
          <button type="button" class="cal-nav" id="prevMonth" aria-label="上个月">‹</button>
          <span class="cal-month" id="monthLabel"></span>
          <button type="button" class="cal-nav" id="nextMonth" aria-label="下个月">›</button>
        </div>
        <div class="cal-legend">
          <span><i class="dot d-empty"></i>未记录</span>
          <span><i class="dot d-done"></i>有记录</span>
        </div>
        <div class="cal-week">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div id="dayDetail" class="day-detail"></div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
